# Schema migrations (Alembic). The app applies them itself at start; this file is for the `alembic` command:
#   .venv\Scripts\alembic revision --autogenerate -m "what changed"    after editing app/models.py
#   .venv\Scripts\alembic upgrade head / downgrade -1 / current / history
# The database comes from the app's settings (DATABASE_URL, or the SQLite file in DATA_DIR), not from here.
[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
