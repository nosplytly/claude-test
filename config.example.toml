# Настройки бота. Скопируйте файл в config.toml и заполните.
# config.toml содержит токен от аккаунта — никому его не показывайте.

[playerok]
# Cookie "token" с playerok.com (DevTools → Application → Cookies).
# Можно не писать сюда, а задать переменную окружения PLAYEROK_TOKEN.
token = ""
# Прокси для запросов к Playerok, например "http://user:pass@1.2.3.4:8080". Пусто — без прокси.
proxy = ""
# Как часто (секунд) проверять новые продажи. Это страховка: обычно события
# приходят мгновенно по WebSocket, но опрос не даст пропустить сделку.
deals_interval = 20
use_websocket = true

[telegram]
enabled = true
# Токен бота от @BotFather. Или переменная окружения TELEGRAM_BOT_TOKEN.
bot_token = ""
# Кому слать уведомления: ваш числовой id (узнать у @userinfobot).
# Перед этим напишите своему боту /start, иначе Telegram не даст ему вам писать.
chat_ids = [123456789]
# Пересылать новые сообщения покупателей из чатов Playerok.
notify_messages = true
messages_interval = 10
proxy = ""

[delivery]
# Автовыдача товара после оплаты.
enabled = true
# После выдачи отметить сделку выполненной (статус SENT), как кнопка «Я отправил».
mark_sent = true

# Правила проверяются по порядку, срабатывает первое подходящее.
# match — часть названия лота (регистр не важен).
# stock_file — файл с товаром: одна строка = один товар, выданная строка удаляется.
#   Многострочный товар пишите в одну строку через \n.
# message — что отправить покупателю. Подстановки: {product}, {buyer}, {item}.
# products_per_sale — сколько строк выдавать за одну покупку.
# low_stock_alert — предупредить в Telegram, когда останется столько штук или меньше.

[[delivery.rules]]
match = "Ключ Steam"
stock_file = "stock/steam_keys.txt"
message = """Спасибо за покупку, {buyer}!
Ваш ключ: {product}
Активация: Steam → Игры → Активировать в Steam.
Пожалуйста, подтвердите сделку и оставьте отзыв 🙏"""
products_per_sale = 1
low_stock_alert = 3

# Правило без stock_file: всем покупателям уходит один и тот же текст.
[[delivery.rules]]
match = "Гайд"
message = "Спасибо за покупку! Ссылка на гайд: https://example.com/guide"

[relist]
# Выставлять лот заново сразу после продажи (бесплатный тариф).
# По умолчанию — только лоты с правилом автовыдачи: лот без правила обычно
# уникален, и второй раз его не продать. Если товар в stock_file закончился,
# лот тоже не перевыставляется.
after_sale = true
# Раз в interval_minutes перевыставлять лоты с истёкшим сроком.
expired = false
interval_minutes = 30
# Только лоты, в названии которых есть одна из строк. Пусто — все лоты
# (после продажи — все лоты с правилом автовыдачи). Названные здесь лоты
# перевыставляются после продажи и без правила.
match = []

[bot]
# Файл, где бот помнит обработанные сделки. Не удаляйте его без нужды.
state_file = "state.json"
# Лог-файл. Пустая строка — только консоль.
log_file = "bot.log"
